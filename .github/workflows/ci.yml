name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit, test and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest harness/ -q --tb=short
          python scripts/platform_contract.py > /tmp/platform-contract.json
          python scripts/platform_runtime_check.py
          python scripts/run_platform_eval.py
          python scripts/check_extension_compatibility.py
          python scripts/verify_docs_runtime_consistency.py

  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve immutable Python runner image
        run: |
          docker pull python:3.12-slim
          echo "AGENT_PLATFORM_PYTHON_CONTAINER_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Exercise real container security boundaries
        env:
          AGENT_PLATFORM_RUN_DOCKER_INTEGRATION: "1"
          AGENT_PLATFORM_RUNTIME_BIND_HOST: "0.0.0.0"
        run: |
          python -m pip install pytest
          python -m pytest harness/integration/test_docker_runner_integration.py -q --tb=short

  distributed-adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_platform
          POSTGRES_USER: agent_platform
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_platform -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Start S3-compatible object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Exercise real distributed adapters
        env:
          AGENT_PLATFORM_RUN_DISTRIBUTED_INTEGRATION: "1"
          AGENT_PLATFORM_DATABASE_URL: postgresql://agent_platform:integration-password@127.0.0.1:5432/agent_platform
          AGENT_PLATFORM_QUEUE_URL: redis://127.0.0.1:6379/0
          AGENT_PLATFORM_S3_ENDPOINT_URL: http://127.0.0.1:9000
          AGENT_PLATFORM_S3_ADDRESSING_STYLE: path
          AGENT_PLATFORM_OBJECT_STORE_BUCKET: agent-platform-ci
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pip install -r requirements.txt
          python -m pytest harness/integration/test_distributed_adapters_integration.py -q --tb=short

  production-profile:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: integration-password
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: integration-password
      GRAFANA_ADMIN_PASSWORD: integration-password
      AGENT_PLATFORM_SESSION_SECRET_FILE: /dev/null
      AGENT_PLATFORM_LOGIN_PASSWORD_FILE: /dev/null
      AGENT_PLATFORM_API_TOKEN_FILE: /dev/null
      AGENT_PLATFORM_TLS_CERT_FILE: /dev/null
      AGENT_PLATFORM_TLS_KEY_FILE: /dev/null
      AGENT_PLATFORM_DOCKER_SOCKET_GID: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Resolve production runner image and validate Compose
        run: |
          docker pull python:3.12-slim
          export AGENT_PLATFORM_PYTHON_CONTAINER_IMAGE="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          echo "AGENT_PLATFORM_PYTHON_CONTAINER_IMAGE=$AGENT_PLATFORM_PYTHON_CONTAINER_IMAGE" >> "$GITHUB_ENV"
          docker compose -f deployment/compose.production.yml config -q
      - name: Build production images and verify bundled Docker client
        run: |
          docker compose -f deployment/compose.production.yml build backend frontend
          docker run --rm agent-platform-backend:latest docker --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F821,F811 --exclude=__pycache__,.git,venv,node_modules
          QUALITY_BASE="${{ github.event.pull_request.base.sha || github.event.before }}" \
            python scripts/check_ruff_new_violations.py
      - name: Check CSS tokens
        run: |
          python scripts/check_css_tokens.py

      - name: Check imports
        run: |
          python -c "
          import importlib, sys
          from pathlib import Path
          errors = []
          for f in Path('.').rglob('*.py'):
              if '.git' in str(f) or '__pycache__' in str(f) or 'venv' in str(f):
                  continue
              mod = str(f).replace('/', '.').replace('\\\\', '.').removesuffix('.py')
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors[:20]:
                  print(e)
              sys.exit(1)
          "

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Windows scripts and shell routing
        shell: pwsh
        run: |
          python -m pip install pytest
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "start.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "stop.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          python -m pytest harness/test_windows_runtime_contract.py -q
          .\start.ps1 -NoBrowser -ValidateOnly
