llm:
  enabled: true
  default_provider: minimax
  safe_mode: true
  timeout_seconds: 90
  providers:
    minimax:
      type: anthropic_messages
      base_url: https://api.minimaxi.com/anthropic/v1
      api_key_env: MINIMAX_API_KEY
      model: MiniMax-M3
      temperature: 0.2
      max_tokens: 50000
