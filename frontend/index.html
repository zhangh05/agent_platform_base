<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f3e8" />
    <meta name="description" content="联智中枢" />
    <title>联智中枢</title>
    <script>
      // Run before the application module imports Zustand stores. Legacy
      // workbench entries can contain complete run/tool payloads and may block
      // the browser while JSON.parse runs during hydration. Chat history is
      // server-owned, so these browser caches are intentionally disposable.
      try {
        const staleKeys = [];
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index) || "";
          if (
            key === "na_workbench"
            || key.startsWith("na_workbench:")
            || key.startsWith("na_workbench_v4:")
            || key.startsWith("chat_stream_inflight:")
          ) staleKeys.push(key);
        }
        staleKeys.forEach((key) => localStorage.removeItem(key));
      } catch (_) {
        // Storage may be disabled; the application can still use server state.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
