name: lzcore

x-backend-environment: &backend-environment
  LZCORE_WORKSPACE_ROOT: /var/lib/lzcore/workspaces
  LZCORE_RUNTIME_BIND_HOST: 0.0.0.0
  LZCORE_IDENTITY_ENABLED: "true"
  LZCORE_AUTH_ENABLED: "true"
  LZCORE_SESSION_SECURE: "true"
  LZCORE_SESSION_SECRET_FILE: /run/secrets/session_secret
  LZCORE_MASTER_KEY_FILE: /run/secrets/master_key
  LZCORE_API_TOKEN_FILE: /run/secrets/api_token
  LZCORE_LOGIN_USERNAME: ${LZCORE_LOGIN_USERNAME:-Admin}
  LZCORE_LOGIN_PASSWORD_FILE: /run/secrets/login_password
  LZCORE_RECORD_STORE_MODE: postgres
  LZCORE_DATABASE_URL: postgresql://lzcore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/lzcore
  LZCORE_OBJECT_STORE_MODE: s3
  LZCORE_OBJECT_STORE_BUCKET: lzcore
  LZCORE_OBJECT_STORE_PREFIX: production
  LZCORE_S3_ENDPOINT_URL: http://minio:9000
  LZCORE_S3_ADDRESSING_STYLE: path
  LZCORE_QUEUE_MODE: redis
  LZCORE_QUEUE_URL: redis://redis:6379/0
  LZCORE_REDIS_URL: redis://redis:6379/0
  LZCORE_EVENT_BUS_MODE: redis
  LZCORE_EVENT_BUS_URL: redis://redis:6379/0
  LZCORE_APPROVAL_TTL_SECONDS: ${LZCORE_APPROVAL_TTL_SECONDS:-1800}
  LZCORE_CONTINUATION_STALL_SECONDS: ${LZCORE_CONTINUATION_STALL_SECONDS:-900}
  LZCORE_CONTINUATION_RETENTION_DAYS: ${LZCORE_CONTINUATION_RETENTION_DAYS:-30}
  LZCORE_PYTHON_REQUIRE_STRONG_ISOLATION: "true"
  LZCORE_PROMPT_CACHE_ENABLED: "true"
  LZCORE_PROMPT_CACHE_SHARDS: "16"
  LZCORE_PYTHON_CONTAINER_IMAGE: ${LZCORE_PYTHON_CONTAINER_IMAGE:?set an immutable image digest}
  DOCKER_HOST: unix:///run/docker.sock
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  AWS_DEFAULT_REGION: us-east-1

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - lzcore-data:/var/lib/lzcore
      - ${LZCORE_DOCKER_SOCKET:-/var/run/docker.sock}:/run/docker.sock
    group_add:
      - ${LZCORE_DOCKER_SOCKET_GID:?set socket group id}
    secrets:
      - session_secret
      - master_key
      - login_password
      - api_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: ..
      dockerfile: deployment/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-c", "from jobs.worker import start_worker; start_worker()"]
    environment:
      <<: *backend-environment
      LZCORE_WORKER_ID: production-worker-1
    volumes:
      - lzcore-data:/var/lib/lzcore
      - ${LZCORE_DOCKER_SOCKET:-/var/run/docker.sock}:/run/docker.sock
    group_add:
      - ${LZCORE_DOCKER_SOCKET_GID:?set socket group id}
    secrets:
      - session_secret
      - master_key
      - login_password
      - api_token
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${LZCORE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LZCORE_TLS_CERT_FILE:?set LZCORE_TLS_CERT_FILE}:/run/tls/tls.crt:ro
      - ${LZCORE_TLS_KEY_FILE:?set LZCORE_TLS_KEY_FILE}:/run/tls/tls.key:ro
    depends_on:
      - frontend
    read_only: true
    tmpfs:
      - /data:size=16m
      - /config:size=16m
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lzcore
      POSTGRES_USER: lzcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lzcore -d lzcore"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/lzcore

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - api_token
    depends_on:
      backend:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  lzcore-data:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:

secrets:
  master_key:
    file: ${LZCORE_MASTER_KEY_FILE:?set LZCORE_MASTER_KEY_FILE}
  session_secret:
    file: ${LZCORE_SESSION_SECRET_FILE:?set LZCORE_SESSION_SECRET_FILE}
  login_password:
    file: ${LZCORE_LOGIN_PASSWORD_FILE:?set LZCORE_LOGIN_PASSWORD_FILE}
  api_token:
    file: ${LZCORE_API_TOKEN_FILE:?set LZCORE_API_TOKEN_FILE}
