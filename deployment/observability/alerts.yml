groups:
  - name: lzcore
    rules:
      - alert: LZCoreTargetDown
        expr: up{job="lzcore"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 联智中枢指标端点不可达
          runbook: docs/OPERATIONS_RUNBOOK.md#服务不可达

      - alert: LZCoreHighHttp5xxRate
        expr: >-
          sum(rate(lzcore_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(lzcore_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: HTTP 5xx 比例持续超过 5%
          runbook: docs/OPERATIONS_RUNBOOK.md#接口错误率升高

      - alert: LZCoreToolFailures
        expr: sum(increase(lzcore_operations_total{operation="tool",status!="succeeded",status!="dry_run"}[10m])) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 工具失败数量异常
          runbook: docs/OPERATIONS_RUNBOOK.md#工具失败

      - alert: LZCoreJobFailures
        expr: sum(increase(lzcore_operations_total{operation="job",status="failed"}[15m])) > 3
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 后台作业连续失败
          runbook: docs/OPERATIONS_RUNBOOK.md#作业失败
