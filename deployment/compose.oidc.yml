services:
  backend:
    environment:
      AGENT_PLATFORM_OIDC_ENABLED: "true"
      AGENT_PLATFORM_PUBLIC_URL: ${AGENT_PLATFORM_PUBLIC_URL:?set AGENT_PLATFORM_PUBLIC_URL}
      AGENT_PLATFORM_OIDC_ISSUER: ${AGENT_PLATFORM_OIDC_ISSUER:?set AGENT_PLATFORM_OIDC_ISSUER}
      AGENT_PLATFORM_OIDC_CLIENT_ID: ${AGENT_PLATFORM_OIDC_CLIENT_ID:?set AGENT_PLATFORM_OIDC_CLIENT_ID}
      AGENT_PLATFORM_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - oidc_client_secret

  worker:
    environment:
      AGENT_PLATFORM_OIDC_ENABLED: "true"
      AGENT_PLATFORM_PUBLIC_URL: ${AGENT_PLATFORM_PUBLIC_URL:?set AGENT_PLATFORM_PUBLIC_URL}
      AGENT_PLATFORM_OIDC_ISSUER: ${AGENT_PLATFORM_OIDC_ISSUER:?set AGENT_PLATFORM_OIDC_ISSUER}
      AGENT_PLATFORM_OIDC_CLIENT_ID: ${AGENT_PLATFORM_OIDC_CLIENT_ID:?set AGENT_PLATFORM_OIDC_CLIENT_ID}
      AGENT_PLATFORM_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - oidc_client_secret

secrets:
  oidc_client_secret:
    file: ${AGENT_PLATFORM_OIDC_CLIENT_SECRET_FILE:?set AGENT_PLATFORM_OIDC_CLIENT_SECRET_FILE}
