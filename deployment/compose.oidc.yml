services:
  backend:
    environment:
      LZCORE_OIDC_ENABLED: "true"
      LZCORE_PUBLIC_URL: ${LZCORE_PUBLIC_URL:?set LZCORE_PUBLIC_URL}
      LZCORE_OIDC_ISSUER: ${LZCORE_OIDC_ISSUER:?set LZCORE_OIDC_ISSUER}
      LZCORE_OIDC_CLIENT_ID: ${LZCORE_OIDC_CLIENT_ID:?set LZCORE_OIDC_CLIENT_ID}
      LZCORE_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - oidc_client_secret

  worker:
    environment:
      LZCORE_OIDC_ENABLED: "true"
      LZCORE_PUBLIC_URL: ${LZCORE_PUBLIC_URL:?set LZCORE_PUBLIC_URL}
      LZCORE_OIDC_ISSUER: ${LZCORE_OIDC_ISSUER:?set LZCORE_OIDC_ISSUER}
      LZCORE_OIDC_CLIENT_ID: ${LZCORE_OIDC_CLIENT_ID:?set LZCORE_OIDC_CLIENT_ID}
      LZCORE_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - oidc_client_secret

secrets:
  oidc_client_secret:
    file: ${LZCORE_OIDC_CLIENT_SECRET_FILE:?set LZCORE_OIDC_CLIENT_SECRET_FILE}
