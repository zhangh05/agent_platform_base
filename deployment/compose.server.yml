name: lzcore-server

x-backend-common: &backend-common
  image: lzcore-backend:server
  build:
    context: ..
    dockerfile: deployment/backend.Dockerfile
  env_file:
    - ../.env.local
  environment:
    LZCORE_WORKSPACE_ROOT: /var/lib/lzcore/workspaces
    LZCORE_RUNTIME_BIND_HOST: 0.0.0.0
    LZCORE_RECORD_STORE_MODE: filesystem
    LZCORE_OBJECT_STORE_MODE: local
    LZCORE_QUEUE_MODE: filesystem
    LZCORE_SESSION_SECURE: "false"
    LZCORE_PYTHON_REQUIRE_STRONG_ISOLATION: "true"
    LZCORE_PROMPT_CACHE_ENABLED: "true"
    LZCORE_PROMPT_CACHE_SHARDS: "16"
    DOCKER_HOST: unix:///run/docker.sock
  volumes:
    - ../workspaces:/var/lib/lzcore/workspaces
    - ../config/providers:/app/config/providers
    - /var/run/docker.sock:/run/docker.sock
  group_add:
    - "${LZCORE_DOCKER_SOCKET_GID:?set LZCORE_DOCKER_SOCKET_GID in deployment/.env}"
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  backend:
    <<: *backend-common
    ports:
      - "127.0.0.1:${LZCORE_BACKEND_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["python", "-c", "from jobs.worker import start_worker; start_worker()"]
    environment:
      LZCORE_WORKSPACE_ROOT: /var/lib/lzcore/workspaces
      LZCORE_RUNTIME_BIND_HOST: 0.0.0.0
      LZCORE_RECORD_STORE_MODE: filesystem
      LZCORE_OBJECT_STORE_MODE: local
      LZCORE_QUEUE_MODE: filesystem
      LZCORE_SESSION_SECURE: "false"
      LZCORE_PYTHON_REQUIRE_STRONG_ISOLATION: "true"
      LZCORE_PROMPT_CACHE_ENABLED: "true"
      LZCORE_PROMPT_CACHE_SHARDS: "16"
      LZCORE_WORKER_ID: server-worker-1
      DOCKER_HOST: unix:///run/docker.sock
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: lzcore-frontend:server
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      - "${LZCORE_HTTP_PORT:-5273}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
